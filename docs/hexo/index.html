<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeXO</title>
    <link rel="stylesheet" href="./style.css">
    <!-- Themes -->
    <link rel="stylesheet" href="./modules/themes/science/science.css">
    <link rel="stylesheet" href="./modules/themes/omok/omok.css">
    <script type="module" src="./main.js"></script>
</head>
<body>
    <main id="board-container" data-theme="science" class="turn-p1">
        <header>
            <h2>Theme</h2>
            <button id="theme-science">Science</button>
            <button id="theme-omok">Omok</button>
        </header>
        <svg id="board">
            <defs>
                <radialGradient id="omok-lines">
                    <stop class="stop3" offset="90%" />
                    <stop class="stop4" offset="100%" />
                </radialGradient>
            </defs>
            <filter id="glow-white">
                <feFlood flood-color="rgb(255,255,255)" flood-opacity="0.5" in="SourceGraphic" />
                <feComposite operator="in" in2="SourceGraphic" />
                <feGaussianBlur stdDeviation="3" />
                <feComponentTransfer result="glow1">
                    <feFuncA type="linear" slope="4" intercept="0" />
                </feComponentTransfer>
                <feMerge>
                    <feMergeNode in="glow1" />
                    <feMergeNode in="SourceGraphic" />
                </feMerge>
            </filter>
            <g id="board-transform">
                <g id="board-bg"></g>
                <g id="cells"></g>
            </g>
        </svg>
        <footer>Handmade by Zye |
            <a href="https://github.com/zyeworld/puzzle" target="_blank">GitHub</a>
        </footer>
    </main>
</body>
</html>
